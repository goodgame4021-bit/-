<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake Game</title>
    <style>
        :root {
            --neon-green: #0f0;
            --neon-pink: #f0f;
            --neon-blue: #0ff;
            --bg-color: #050505;
            --grid-color: #111;
        }

        body {
            margin: 0;
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            border: 2px solid var(--neon-green);
            border-radius: 8px;
        }

        canvas {
            display: block;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        #ui {
            width: 400px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .score-box {
            color: var(--neon-blue);
            text-shadow: 0 0 5px var(--neon-blue);
        }

        .high-score-box {
            color: var(--neon-pink);
            text-shadow: 0 0 5px var(--neon-pink);
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            z-index: 10;
        }

        #overlay h1 {
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
            margin-bottom: 20px;
            font-size: 3rem;
        }

        #overlay button {
            background: transparent;
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            padding: 10px 20px;
            font-size: 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            box-shadow: 0 0 5px var(--neon-green);
        }

        #overlay button:hover {
            background: var(--neon-green);
            color: black;
            box-shadow: 0 0 20px var(--neon-green);
        }

        .instructions {
            margin: 20px 0 40px 0;
            color: #666;
            font-size: 0.9rem;
        }

        /* Disqus Container */
        #comment-section {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            background: #111;
            border-top: 1px solid #333;
            margin-top: 50px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="score-box">SCORE: <span id="score">0</span></div>
        <div class="high-score-box">BEST: <span id="high-score">0</span></div>
    </div>

    <div id="game-container">
        <canvas id="snakeCanvas" width="400" height="400"></canvas>
        <div id="overlay">
            <h1>GAME OVER</h1>
            <button onclick="resetGame()">PLAY AGAIN</button>
        </div>
    </div>

    <div class="instructions">Use Arrow Keys or WASD to Move</div>

    <!-- Disqus Comment Thread -->
    <div id="comment-section">
        <div id="disqus_thread"></div>
    </div>

    <script>
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');
        const overlay = document.getElementById('overlay');

        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;

        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 0;
        let dy = 0;
        let nextDx = 1;
        let nextDy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop;
        let isGameOver = false;
        let speed = 100;

        highScoreElement.innerText = highScore;

        // Key handlers
        document.addEventListener('keydown', (e) => {
            const keys = ['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd', ' '];
            if (keys.includes(e.key.toLowerCase())) {
                e.preventDefault(); // Prevent scrolling with keys
            }

            switch(e.key.toLowerCase()) {
                case 'arrowup':
                case 'w':
                    if (dy !== 1) { nextDx = 0; nextDy = -1; }
                    break;
                case 'arrowdown':
                case 's':
                    if (dy !== -1) { nextDx = 0; nextDy = 1; }
                    break;
                case 'arrowleft':
                case 'a':
                    if (dx !== 1) { nextDx = -1; nextDy = 0; }
                    break;
                case 'arrowright':
                case 'd':
                    if (dx !== -1) { nextDx = 1; nextDy = 0; }
                    break;
            }
        });

        function draw() {
            if (isGameOver) return;

            // Move snake
            dx = nextDx;
            dy = nextDy;
            
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall collision
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameOver();
                return;
            }

            // Self collision
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.innerText = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }
                spawnFood();
                // Speed up slightly
                if (speed > 50) {
                    clearInterval(gameLoop);
                    speed -= 1;
                    gameLoop = setInterval(draw, speed);
                }
            } else {
                snake.pop();
            }

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw food
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#f0f';
            ctx.fillStyle = '#f0f';
            ctx.beginPath();
            ctx.arc(food.x * GRID_SIZE + GRID_SIZE/2, food.y * GRID_SIZE + GRID_SIZE/2, GRID_SIZE/2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // Draw snake
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#0f0';
            ctx.fillStyle = '#0f0';
            snake.forEach((part, index) => {
                const x = part.x * GRID_SIZE;
                const y = part.y * GRID_SIZE;
                
                // Head is slightly different
                if (index === 0) {
                    ctx.fillStyle = '#0f0';
                } else {
                    ctx.fillStyle = '#0a0';
                }
                
                ctx.fillRect(x + 1, y + 1, GRID_SIZE - 2, GRID_SIZE - 2);
            });
            
            ctx.shadowBlur = 0; // Reset blur for other elements
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * TILE_COUNT),
                y: Math.floor(Math.random() * TILE_COUNT)
            };
            // Don't spawn on snake
            for (let part of snake) {
                if (part.x === food.x && part.y === food.y) {
                    spawnFood();
                    break;
                }
            }
        }

        function gameOver() {
            isGameOver = true;
            clearInterval(gameLoop);
            overlay.style.display = 'flex';
        }

        function resetGame() {
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            score = 0;
            speed = 100;
            isGameOver = false;
            scoreElement.innerText = score;
            overlay.style.display = 'none';
            spawnFood();
            clearInterval(gameLoop);
            gameLoop = setInterval(draw, speed);
        }

        // Start game
        spawnFood();
        gameLoop = setInterval(draw, speed);

        /**
        *  DISQUS INTEGRATION
        */
        var disqus_config = function () {
            this.page.url = window.location.href;  
            this.page.identifier = 'snake-game-page'; 
        };
        (function() {
            var d = document, s = d.createElement('script');
            s.src = 'https://workspaces-codespaces-blank-index-html.disqus.com/embed.js';
            s.setAttribute('data-timestamp', +new Date());
            (d.head || d.body).appendChild(s);
        })();
    </script>

</body>
</html>
